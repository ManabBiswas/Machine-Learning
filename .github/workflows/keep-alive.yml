# Pings free-tier backend(s) once a week so Render doesn't sleep them.
# Add a new - run: curl line per deployed service.
name: Keep Alive

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake cardiolens-api
        run: curl -fsS --max-time 30 https://cardiolens-api-r1q7.onrender.com/health || echo "::warning::cardiolens-api did not respond (suspended or starting)"
      # - name: Wake future-api
      #   run: curl -fsS https://your-future-service.onrender.com/health || exit 1
